[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin Node for consistent builds. Netlify respects .nvmrc too, but setting here is explicit.
  NODE_VERSION = "18"

[dev]
  framework = "vite"
  # When running Netlify CLI preview, use the vite dev server and bind to 0.0.0.0 so it's reachable.
  command = "npm run dev -- --host 0.0.0.0 --port 8888"
  port = 8888

[functions]
  directory = "netlify/functions"

# Eski adresler; /gizlilik/ ve /veri-silme/ statik klasor olarak dogrudan sunulur.
[[redirects]]
  from = "/privacy"
  to = "/gizlilik/"
  status = 301

[[redirects]]
  from = "/data-deletion"
  to = "/veri-silme/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
