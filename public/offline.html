<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#b91c1c" />
    <title>Bağlantı yok | DersTimeTable</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #1e293b; }
      main { width: min(88vw, 520px); padding: 32px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; box-shadow: 0 12px 32px rgb(15 23 42 / 10%); }
      img { width: 112px; height: 112px; object-fit: contain; }
      h1 { margin: 18px 0 10px; font-size: 24px; }
      p { margin: 0 0 22px; color: #475569; line-height: 1.6; }
      button { border: 0; border-radius: 10px; padding: 12px 20px; background: #b91c1c; color: #fff; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/icons/icon-192.png" alt="DersTimeTable" />
      <h1>İnternet bağlantısı bulunamadı</h1>
      <p>DersTimeTable'ın program oluşturma ve bulut özelliklerini kullanmak için internete bağlanın. Bağlantı geldikten sonra yeniden deneyebilirsiniz.</p>
      <button type="button" onclick="location.reload()">Yeniden dene</button>
    </main>
  </body>
</html>
